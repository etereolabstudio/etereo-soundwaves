<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etéreo - Memoria Acústica</title>
    <style>
        body {
            background-color: #F7F7F9; /* Gris perla Etéreo */
            color: #2B2B2B; /* Gris carbón */
            font-family: 'Helvetica', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 40px;
            background-color: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 90%;
            width: 320px;
        }
        h1 {
            font-size: 24px;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        p {
            font-size: 14px;
            color: #8B8B8B;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        /* Estilizando el reproductor nativo */
        audio {
            width: 100%;
            outline: none;
            border-radius: 30px;
        }
        .etereo-accent {
            color: #A39171; /* Oro apagado / Arena */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ETÉREO</h1>
        <p id="status-text">Buscando cápsula...</p>
        
        <audio id="audio-player" controls style="display: none;">
            Tu navegador no soporta el reproductor de audio.
        </audio>
    </div>

    <script>
        // Extraemos el ID de la URL (ej. play.etereomx.com/?id=123456)
        const params = new URLSearchParams(window.location.search);
        const audioId = params.get('id');
        const statusText = document.getElementById('status-text');
        const player = document.getElementById('audio-player');

        if (audioId) {
            // Construimos la ruta del archivo WAV
            const audioPath = `audios/${audioId}.wav`;
            
            // Verificamos si el archivo existe
            fetch(audioPath, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        player.src = audioPath;
                        player.style.display = "block";
                        statusText.innerHTML = "Memoria acústica recuperada.<br><span class='etereo-accent'>Presiona reproducir.</span>";
                    } else {
                        statusText.innerText = "La cápsula está vacía o aún se está sincronizando con la bóveda.";
                    }
                })
                .catch(() => {
                    statusText.innerText = "Error de conexión con la red Etéreo.";
                });
        } else {
            statusText.innerText = "No se detectó ninguna firma acústica en el escaneo.";
        }
    </script>

</body>
</html>
