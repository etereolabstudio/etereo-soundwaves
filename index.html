<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etéreo | Memoria Acústica</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap');

        body {
            background-color: #F7F7F9;
            color: #2B2B2B;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .card {
            background: #FFFFFF;
            padding: 40px 30px 30px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.04);
            max-width: 340px;
            width: 90%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 6px;
            margin: 0 0 5px 0;
            color: #1A1A1A;
            text-transform: uppercase;
        }

        .status-text {
            font-size: 12px;
            color: #8B8B8B;
            margin-bottom: 25px;
            line-height: 1.6;
            min-height: 40px;
        }

        .accent {
            color: #A39171;
            font-style: italic;
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
        }

        /* --- CONTENEDOR DEL CANVAS (ONDA DE SONIDO) --- */
        .waveform-wrapper {
            width: 100%;
            height: 80px;
            margin-bottom: 25px;
            position: relative;
            display: block; /* Ahora siempre visible */
        }

        canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- BOTÓN PLAY FLOTANTE --- */
        .play-btn {
            background-color: #A39171;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(163, 145, 113, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .play-btn:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 6px 20px rgba(163, 145, 113, 0.4);
        }

        .icon-play, .icon-pause {
            fill: #FFFFFF;
            width: 18px;
            height: 18px;
        }
        .icon-pause { display: none; }

        /* --- ENLACE DE RETORNO --- */
        .back-link {
            margin-top: 20px;
            font-size: 11px;
            color: #A39171;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #1A1A1A;
        }
        
        audio { display: none; }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h1 class="brand-title">Etéreo</h1>
        <p class="status-text" id="status-text">Analizando señal acústica...</p>
        
        <div class="waveform-wrapper" id="waveform-wrapper">
            <canvas id="canvas-base"></canvas>
            <canvas id="canvas-progress"></canvas>
            
            <button class="play-btn" id="custom-play-btn" onclick="togglePlay()">
                <svg class="icon-play" id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg class="icon-pause" id="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>

        <a href="https://etereomx.com" class="back-link">Descubre Etéreo Studio</a>
        <audio id="native-audio"></audio>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const audioId = params.get('id');
        
        const statusText = document.getElementById('status-text');
        const waveformWrapper = document.getElementById('waveform-wrapper');
        const audioEl = document.getElementById('native-audio');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        
        const canvasBase = document.getElementById('canvas-base');
        const canvasProgress = document.getElementById('canvas-progress');
        const ctxBase = canvasBase.getContext('2d');
        const ctxProgress = canvasProgress.getContext('2d');

        let animationFrame;
        let peaks = [];
        let isDemo = !audioId; // Bandera para saber si estamos en modo demostración
        let isPlaying = false;
        
        // Variables para la animación de la demo
        let demoProgress = 0;
        let lastTime = 0;
        const demoDuration = 10000; // 10 segundos de duración simulada

        const colorBase = "#EAEAEA"; 
        const colorProgress = "#A39171"; 

        if (!isDemo) {
            // --- MODO PRODUCCIÓN (CON ID) ---
            const audioPath = `audios/${audioId}.wav`;
            audioEl.src = audioPath;
            
            fetch(audioPath)
                .then(response => {
                    if (!response.ok) throw new Error("Cápsula no encontrada");
                    return response.arrayBuffer();
                })
                .then(arrayBuffer => {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    return audioCtx.decodeAudioData(arrayBuffer);
                })
                .then(audioBuffer => {
                    processAudioData(audioBuffer);
                    statusText.innerHTML = "<span class='accent'>Memoria lista.</span>";
                })
                .catch(() => {
                    // Si falla, activamos el modo demo para que no se quede feo
                    isDemo = true;
                    initDemoMode("La cápsula aún se está sincronizando.<br>Mientras tanto, <span class='accent'>prueba el reproductor.</span>");
                });

        } else {
            // --- MODO DEMOSTRACIÓN (SIN ID) ---
            initDemoMode("Materializamos el sonido.<br>Acerca tu celular a tu cuadro o <span class='accent'>prueba la demostración.</span>");
        }

        // --- GENERADOR DE ONDAS FALSAS PARA LA DEMO ---
        function initDemoMode(message) {
            statusText.innerHTML = message;
            peaks = [];
            // Generamos una onda matemática con forma de diamante para que luzca estéticamente hermosa
            for(let i = 0; i < 200; i++) {
                let wave = Math.abs(Math.sin(i * 0.1) * Math.cos(i * 0.05));
                let noise = Math.random() * 0.3;
                let bellCurve = Math.sin(Math.PI * (i / 200)); // Para que empiece y termine en punta
                peaks.push(((wave + noise) * bellCurve) * 0.8 + 0.05);
            }
            prepareCanvases();
        }

        // --- MATEMÁTICA DE PROCESAMIENTO DE SEÑAL REAL ---
        function processAudioData(audioBuffer) {
            const rawData = audioBuffer.getChannelData(0); 
            const numSamples = 200; 
            const blockSize = Math.floor(rawData.length / numSamples);
            let maxPeak = 0;
            
            for (let i = 0; i < numSamples; i++) {
                let sum = 0;
                for (let j = 0; j < blockSize; j++) {
                    sum += Math.abs(rawData[i * blockSize + j]);
                }
                let peak = sum / blockSize;
                peaks.push(peak);
                if (peak > maxPeak) maxPeak = peak;
            }

            peaks = peaks.map(p => (p / maxPeak) * 0.8 + 0.05); 
            prepareCanvases();
        }

        // --- CONFIGURACIÓN RESPONSIVE DE CANVASES ---
        function prepareCanvases() {
            const dpr = window.devicePixelRatio || 1;
            const rect = waveformWrapper.getBoundingClientRect();
            
            [canvasBase, canvasProgress].forEach(c => {
                c.width = rect.width * dpr;
                c.height = rect.height * dpr;
                c.getContext('2d').scale(dpr, dpr);
            });

            drawPolygon(ctxBase, canvasBase.width / dpr, canvasBase.height / dpr, colorBase);
            updateProgress(); 
        }

        // --- RENDERIZADO DEL POLÍGONO SÍMETRICO ---
        function drawPolygon(ctx, width, height, color) {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = color;
            ctx.beginPath();
            
            const centerY = height / 2;
            const step = width / (peaks.length - 1);
            
            ctx.moveTo(0, centerY);
            for (let i = 0; i < peaks.length; i++) {
                let amp = peaks[i] * height;
                ctx.lineTo(i * step, centerY - (amp / 2));
            }
            
            for (let i = peaks.length - 1; i >= 0; i--) {
                let amp = peaks[i] * height;
                ctx.lineTo(i * step, centerY + (amp / 2));
            }
            
            ctx.closePath();
            ctx.fill();
        }

        // --- ANIMACIÓN DE PROGRESO DE LA MÁSCARA ---
        function updateProgress() {
            if (!peaks.length) return;
            
            const rect = canvasProgress.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            
            let currentP = 0;

            if (isDemo) {
                if (isPlaying) {
                    let now = Date.now();
                    let delta = now - lastTime;
                    lastTime = now;
                    demoProgress += delta / demoDuration;
                    
                    if (demoProgress >= 1) {
                        demoProgress = 1;
                        handlePlaybackEnd();
                    }
                }
                currentP = demoProgress;
            } else {
                currentP = (audioEl.currentTime / (audioEl.duration || 1));
            }

            const fillWidth = width * currentP;

            ctxProgress.clearRect(0, 0, width, height);
            ctxProgress.save();
            ctxProgress.beginPath();
            ctxProgress.rect(0, 0, fillWidth, height);
            ctxProgress.clip();
            drawPolygon(ctxProgress, width, height, colorProgress);
            ctxProgress.restore();

            if (isPlaying) {
                animationFrame = requestAnimationFrame(updateProgress);
            }
        }

        // --- CONTROL DE REPRODUCCIÓN ---
        function togglePlay() {
            if (!isPlaying) {
                // Iniciar
                isPlaying = true;
                iconPlay.style.display = "none";
                iconPause.style.display = "block";
                
                if (isDemo) {
                    if (demoProgress >= 1) demoProgress = 0; // Reiniciar si había terminado
                    lastTime = Date.now();
                    statusText.innerHTML = "<span class='accent'>Reproduciendo demostración...</span>";
                    updateProgress();
                } else {
                    audioEl.play();
                    statusText.innerHTML = "<span class='accent'>Reproduciendo memoria...</span>";
                    updateProgress();
                }
            } else {
                // Pausar
                isPlaying = false;
                iconPlay.style.display = "block";
                iconPause.style.display = "none";
                statusText.innerHTML = "Pausado.<br><span class='accent'>Presiona reproducir.</span>";
                if (!isDemo) audioEl.pause();
                cancelAnimationFrame(animationFrame);
            }
        }

        function handlePlaybackEnd() {
            isPlaying = false;
            iconPlay.style.display = "block";
            iconPause.style.display = "none";
            
            if (isDemo) {
                statusText.innerHTML = "Demostración finalizada.<br><span class='accent'>Vuelve a escuchar.</span>";
            } else {
                statusText.innerHTML = "Memoria finalizada.<br><span class='accent'>Vuelve a reproducir.</span>";
                audioEl.currentTime = 0; // Reseteamos la pista real
            }
            
            cancelAnimationFrame(animationFrame);
            updateProgress(); // Para que dibuje el final o el reinicio
        }

        audioEl.onended = handlePlaybackEnd;
    </script>
</body>
</html>
