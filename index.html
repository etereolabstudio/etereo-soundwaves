<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etéreo | Memoria Acústica</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap');

        body {
            background-color: #F7F7F9;
            color: #2B2B2B;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .card {
            background: #FFFFFF;
            padding: 40px 30px 30px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.04);
            max-width: 340px;
            width: 90%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 6px;
            margin: 0 0 5px 0;
            color: #1A1A1A;
            text-transform: uppercase;
        }

        .status-text {
            font-size: 12px;
            color: #8B8B8B;
            margin-bottom: 25px;
            line-height: 1.6;
            min-height: 20px;
        }

        .accent {
            color: #A39171;
            font-style: italic;
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
        }

        /* --- CONTENEDOR DEL CANVAS (ONDA DE SONIDO) --- */
        .waveform-wrapper {
            width: 100%;
            height: 80px;
            margin-bottom: 25px;
            position: relative;
            display: none; /* Oculto hasta cargar */
            cursor: pointer;
        }

        canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- BOTÓN PLAY FLOTANTE --- */
        .play-btn {
            background-color: #A39171;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(163, 145, 113, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .play-btn:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 6px 20px rgba(163, 145, 113, 0.4);
        }

        .icon-play, .icon-pause {
            fill: #FFFFFF;
            width: 18px;
            height: 18px;
        }
        .icon-pause { display: none; }

        /* --- ENLACE DE RETORNO --- */
        .back-link {
            margin-top: 20px;
            font-size: 11px;
            color: #A39171;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #1A1A1A;
        }
        
        audio { display: none; }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h1 class="brand-title">Etéreo</h1>
        <p class="status-text" id="status-text">Analizando señal acústica...</p>
        
        <!-- Contenedor interactivo de la Onda -->
        <div class="waveform-wrapper" id="waveform-wrapper">
            <!-- Canvas Base (Gris) -->
            <canvas id="canvas-base"></canvas>
            <!-- Canvas Progreso (Color Acento) -->
            <canvas id="canvas-progress"></canvas>
            
            <button class="play-btn" id="custom-play-btn" onclick="togglePlay()">
                <svg class="icon-play" id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg class="icon-pause" id="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>

        <a href="https://etereomx.com" class="back-link">Visitar etereomx.com</a>
        <audio id="native-audio"></audio>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const audioId = params.get('id');
        
        const statusText = document.getElementById('status-text');
        const waveformWrapper = document.getElementById('waveform-wrapper');
        const audioEl = document.getElementById('native-audio');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        
        const canvasBase = document.getElementById('canvas-base');
        const canvasProgress = document.getElementById('canvas-progress');
        const ctxBase = canvasBase.getContext('2d');
        const ctxProgress = canvasProgress.getContext('2d');

        let animationFrame;
        let peaks = [];

        // Colores de la marca Etéreo
        const colorBase = "#EAEAEA"; // Gris muy claro para la onda sin reproducir
        const colorProgress = "#A39171"; // Oro apagado

        if (audioId) {
            const audioPath = `audios/${audioId}.wav`;
            
            // 1. Cargamos el audio para el reproductor nativo
            audioEl.src = audioPath;
            
            // 2. Cargamos el buffer del audio para dibujar la gráfica
            fetch(audioPath)
                .then(response => {
                    if (!response.ok) throw new Error("Cápsula no encontrada");
                    return response.arrayBuffer();
                })
                .then(arrayBuffer => {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    return audioCtx.decodeAudioData(arrayBuffer);
                })
                .then(audioBuffer => {
                    processAudioData(audioBuffer);
                    waveformWrapper.style.display = "block";
                    statusText.innerHTML = "<span class='accent'>Memoria lista.</span>";
                })
                .catch(() => {
                    statusText.innerHTML = "La cápsula está vacía o aún se está sincronizando.";
                });

        } else {
            statusText.innerHTML = "Acerca tu dispositivo al chip NFC de tu cuadro.<br><br><span class='accent'>etereomx.com</span>";
        }

        // --- MATEMÁTICA DE PROCESAMIENTO DE SEÑAL ---
        function processAudioData(audioBuffer) {
            const rawData = audioBuffer.getChannelData(0); // Tomamos el canal mono
            const numSamples = 200; // Densidad del polígono (Resolución)
            const blockSize = Math.floor(rawData.length / numSamples);
            
            let maxPeak = 0;
            
            // Extracción de la envolvente de amplitud
            for (let i = 0; i < numSamples; i++) {
                let sum = 0;
                for (let j = 0; j < blockSize; j++) {
                    sum += Math.abs(rawData[i * blockSize + j]);
                }
                let peak = sum / blockSize;
                peaks.push(peak);
                if (peak > maxPeak) maxPeak = peak;
            }

            // Normalización y Suavizado básico
            peaks = peaks.map(p => (p / maxPeak) * 0.8 + 0.05); // 0.05 mínimo para línea estética

            // Ajustamos la resolución interna del canvas para pantallas de alta densidad (Retina)
            const dpr = window.devicePixelRatio || 1;
            const rect = waveformWrapper.getBoundingClientRect();
            
            [canvasBase, canvasProgress].forEach(c => {
                c.width = rect.width * dpr;
                c.height = rect.height * dpr;
                c.getContext('2d').scale(dpr, dpr);
            });

            drawPolygon(ctxBase, canvasBase.width / dpr, canvasBase.height / dpr, colorBase);
            updateProgress(); // Dibuja el estado inicial en 0
        }

        // --- RENDERIZADO DEL POLÍGONO SÍMETRICO ---
        function drawPolygon(ctx, width, height, color) {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = color;
            ctx.beginPath();
            
            const centerY = height / 2;
            const step = width / (peaks.length - 1);
            
            // Borde Superior
            ctx.moveTo(0, centerY);
            for (let i = 0; i < peaks.length; i++) {
                let amp = peaks[i] * height;
                ctx.lineTo(i * step, centerY - (amp / 2));
            }
            
            // Borde Inferior (Espejo)
            for (let i = peaks.length - 1; i >= 0; i--) {
                let amp = peaks[i] * height;
                ctx.lineTo(i * step, centerY + (amp / 2));
            }
            
            ctx.closePath();
            ctx.fill();
        }

        // --- ANIMACIÓN DE PROGRESO DE LA MÁSCARA ---
        function updateProgress() {
            if (!peaks.length) return;
            
            const rect = canvasProgress.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            
            // Calculamos el porcentaje reproducido
            const progress = (audioEl.currentTime / (audioEl.duration || 1));
            const fillWidth = width * progress;

            // Dibujamos la misma onda, pero aplicando la técnica de enmascaramiento (Clipping)
            ctxProgress.clearRect(0, 0, width, height);
            
            ctxProgress.save();
            ctxProgress.beginPath();
            ctxProgress.rect(0, 0, fillWidth, height);
            ctxProgress.clip();
            
            drawPolygon(ctxProgress, width, height, colorProgress);
            ctxProgress.restore();

            if (!audioEl.paused) {
                animationFrame = requestAnimationFrame(updateProgress);
            }
        }

        // --- CONTROL DE REPRODUCCIÓN ---
        function togglePlay() {
            if (audioEl.paused) {
                audioEl.play();
                iconPlay.style.display = "none";
                iconPause.style.display = "block";
                statusText.innerHTML = "<span class='accent'>Reproduciendo memoria...</span>";
                updateProgress();
            } else {
                audioEl.pause();
                iconPlay.style.display = "block";
                iconPause.style.display = "none";
                statusText.innerHTML = "Pausado.<br><span class='accent'>Presiona reproducir.</span>";
                cancelAnimationFrame(animationFrame);
            }
        }

        audioEl.onended = function() {
            iconPlay.style.display = "block";
            iconPause.style.display = "none";
            statusText.innerHTML = "Memoria finalizada.<br><span class='accent'>Vuelve a reproducir.</span>";
            cancelAnimationFrame(animationFrame);
            // Reseteamos la barra a 0
            audioEl.currentTime = 0;
            updateProgress();
        };
    </script>
</body>
</html>
