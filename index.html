<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Etéreo | Memoria Acústica</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23121016'/%3E%3Ccircle cx='50' cy='50' r='34' fill='none' stroke='%23DD8E5C' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='9' fill='%23DD8E5C'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@1,400;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           VARIABLES Y PALETA ETÉREO
           ========================================= */
        :root {
            --bg-color: #0c0b0f;
            
            /* Colores del Reproductor (Deck) */
            --deck-base: #18161d;
            --deck-dark: #0e0d12;
            --deck-edge: #2a2732;
            
            /* Colores del Cassette */
            --cassette-bg: #222029;
            --label-bg: #EAE3D2;
            --label-text: #1B1912;
            
            /* Acentos Etéreo y Retro */
            --text-color: #9B9488;
            --title-color: #EDE6D6;
            --accent: #DD8E5C;
            --accent-glow: rgba(221, 142, 92, 0.4);
            
            /* LEDs Retro */
            --retro-green: #34d399;
            --retro-red: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Outfit', sans-serif; font-weight: 300;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 24px; text-align: center; overflow-x: hidden;
            position: relative;
        }

        /* Iluminación de fondo */
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(ellipse 45% 45% at 80% 20%, rgba(221, 142, 92, 0.08) 0%, transparent 65%),
                radial-gradient(ellipse 50% 50% at -10% 115%, rgba(139, 132, 163, 0.06) 0%, transparent 60%);
        }
        body::after {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9998; opacity: 0.15; mix-blend-mode: overlay;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        .mono { font-family: 'Space Mono', monospace; }

        /* =========================================
           EL REPRODUCTOR (TAPE DECK / WALKMAN)
           ========================================= */
        .player-deck {
            position: relative; z-index: 1;
            background: linear-gradient(180deg, var(--deck-edge) 0%, var(--deck-base) 20%, var(--deck-dark) 100%);
            border-radius: 12px; padding: 14px 14px 24px 14px;
            max-width: 380px; width: 100%;
            box-shadow: 
                inset 0 1px 2px rgba(255,255,255,0.08), inset 0 -2px 5px rgba(0,0,0,0.8),
                0 30px 50px rgba(0,0,0,0.6), 0 10px 15px rgba(0,0,0,0.4);
            border: 1px solid #322E3A;
            display: flex; flex-direction: column; gap: 16px;
        }

        /* =========================================
           COMPARTIMENTO DEL CASSETTE
           ========================================= */
        .cassette-compartment {
            background: #08070a; border-radius: 8px; padding: 12px;
            box-shadow: inset 0 8px 15px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,255,255,0.03);
            position: relative;
        }

        .cassette {
            background: linear-gradient(180deg, #322e3b 0%, var(--cassette-bg) 100%);
            border-radius: 6px; padding: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.1);
            border: 1px solid rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 8px;
        }

        .cassette-label {
            background: linear-gradient(160deg, var(--label-bg) 0%, #D4CBB5 100%);
            color: var(--label-text); border-radius: 4px; padding: 12px 16px; margin: 0 8px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.4);
        }
        .cassette-label::before { content: ''; position: absolute; left: 12px; right: 12px; top: 6px; height: 1px; background: rgba(27,25,18,0.15); }
        .cassette-label::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 6px; height: 1px; background: rgba(27,25,18,0.15); }

        .brand-title {
            font-family: 'Clash Display', sans-serif; font-weight: 600; font-size: 22px; 
            letter-spacing: 5px; text-transform: uppercase; margin: 0; text-shadow: 0px 1px 1px rgba(255,255,255,0.6);
        }
        .side-tag { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.7; margin-top: 2px; font-weight: 700; }

        /* Ventana del cassette (Carretes) */
        .cassette-window {
            background: #040305; margin: 0 16px; border-radius: 6px; padding: 4px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,1), inset 0 0 0 1px rgba(255,255,255,0.04);
            height: 75px; position: relative; overflow: hidden;
        }

        .window-glass { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .window-glass::after {
            content: ''; position: absolute; inset: 0; z-index: 10; pointer-events: none;
            background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.03) 45%, rgba(255,255,255,0.06) 50%, transparent 55%);
        }

        .reels-row { display: flex; justify-content: center; align-items: center; gap: 55px; position: relative; z-index: 2; width: 100%; }
        
        .tape-spool {
            position: absolute; background: #150F0B; border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 0 0 1px #090604; z-index: 0;
        }
        .tape-spool-left { width: 70px; height: 70px; } 
        .tape-spool-right { width: 55px; height: 55px; }

        .reel {
            width: 36px; height: 36px; border-radius: 50%;
            background: radial-gradient(circle at center, #100E14 18%, transparent 20%),
                        repeating-conic-gradient(from 0deg, transparent 0deg, transparent 35deg, #D8D3C8 35deg, #D8D3C8 60deg);
            border: 4px solid #D8D3C8; position: relative; z-index: 2; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .reel::after {
            content: ''; position: absolute; inset: 25%; border-radius: 50%;
            background: #0A090D; border: 1px solid rgba(255,255,255,0.1);
        }
        .reel.spinning { animation: reel-spin 2s linear infinite; }
        @keyframes reel-spin { to { transform: rotate(360deg); } }

        /* =========================================
           PANTALLA DIGITAL (HUD & WAVEFORM)
           ========================================= */
        .digital-display {
            background: #070608; border: 1px solid #1a1820; border-radius: 6px; 
            padding: 12px 14px 10px; box-shadow: inset 0 6px 12px rgba(0,0,0,0.8);
            position: relative; margin: 0 4px;
        }

        .status-text {
            font-size: 11px; color: var(--text-color); margin-bottom: 12px; line-height: 1.5; 
            min-height: 16px; font-family: 'Space Mono', monospace; letter-spacing: 0.5px;
            display: flex; justify-content: space-between;
        }
        .accent { color: var(--accent); font-style: italic; font-family: 'Playfair Display', serif; font-size: 13px; }

        /* Ahora la onda está 100% libre de botones */
        .waveform-wrapper { 
            width: 100%; height: 50px; position: relative; display: block; cursor: pointer; border-radius: 2px;
            background: repeating-linear-gradient(90deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 4px);
        }
        canvas { width: 100%; height: 100%; position: absolute; top: 0; left: 0; filter: drop-shadow(0 0 3px var(--accent-glow)); }

        .time-display {
            display: flex; justify-content: space-between; margin-top: 8px;
            font-size: 10px; letter-spacing: 1.5px; color: var(--title-color); opacity: 0.8; font-weight: 700;
        }

        .waveform-wrapper.loading::before {
            content: ''; position: absolute; inset: 0; z-index: 5;
            background: linear-gradient(90deg, transparent, rgba(221, 142, 92, 0.2), transparent);
            background-size: 200% 100%; animation: shimmer-sweep 1.5s ease-in-out infinite;
        }
        @keyframes shimmer-sweep { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* =========================================
           BOTONES MECÁNICOS DEL REPRODUCTOR
           ========================================= */
        .mechanical-controls {
            display: flex; justify-content: center; gap: 12px; margin-top: 4px; padding: 0 4px;
        }

        .mech-btn {
            flex: 1; height: 48px; border-radius: 4px; cursor: pointer;
            background: linear-gradient(180deg, #2b2834 0%, #1e1b25 100%);
            border: 1px solid #000; border-top: 1px solid #433e50;
            /* El efecto 3D mecánico grueso */
            box-shadow: 
                0 4px 0 #08070a, /* Grosor frontal del botón */
                0 6px 10px rgba(0,0,0,0.6), /* Sombra proyectada */
                inset 0 1px 2px rgba(255,255,255,0.1); /* Brillo superior */
            color: var(--text-color); font-family: 'Space Mono', monospace; font-size: 10px; 
            letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
            transition: transform 0.1s, box-shadow 0.1s, background 0.2s;
            position: relative;
        }

        .mech-btn:hover { background: linear-gradient(180deg, #322e3d 0%, #23202b 100%); color: var(--title-color); }
        
        /* Efecto de hundimiento mecánico al presionar */
        .mech-btn:active, .mech-btn.active-state {
            transform: translateY(4px);
            box-shadow: 
                0 0px 0 #08070a, 
                0 2px 4px rgba(0,0,0,0.6),
                inset 0 2px 4px rgba(0,0,0,0.5);
            background: linear-gradient(180deg, #18161d 0%, #1e1b25 100%);
            border-top: 1px solid #111;
        }

        /* Leds indicadores en los botones */
        .btn-led { width: 16px; height: 3px; border-radius: 2px; background: #111; box-shadow: inset 0 1px 2px rgba(0,0,0,0.8); }
        
        .mech-btn.stop-btn:active .btn-led { background: var(--retro-red); box-shadow: 0 0 6px var(--retro-red); }
        /* El LED verde se mantiene encendido mientras suena */
        .mech-btn.play-btn.playing .btn-led { background: var(--retro-green); box-shadow: 0 0 8px var(--retro-green); }

        .btn-content { display: flex; align-items: center; gap: 6px; }
        .btn-icon { width: 10px; height: 10px; fill: currentColor; }

        /* =========================================
           ENLACES
           ========================================= */
        .back-link {
            margin-top: 32px; display: inline-block; font-family: 'Space Mono', monospace;
            font-size: 11px; color: var(--text-color); text-decoration: none;
            text-transform: uppercase; letter-spacing: 2px; font-weight: 400;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px;
            transition: color 0.3s, border-color 0.3s; position: relative; z-index: 1;
        }
        .back-link:hover { color: var(--title-color); border-color: var(--accent); }

        audio { display: none; }
    </style>
</head>
<body>

    <!-- REPRODUCTOR (EL DECK) -->
    <div class="player-deck" id="main-card">
        
        <!-- COMPARTIMENTO Y CASSETTE -->
        <div class="cassette-compartment">
            <div class="cassette">
                <div class="cassette-label">
                    <h1 class="brand-title">Etéreo</h1>
                    <p class="side-tag mono">Memoria Acústica</p>
                </div>
                <div class="cassette-window">
                    <div class="window-glass">
                        <div class="reels-row">
                            <div class="tape-spool tape-spool-left"></div>
                            <div class="reel" id="reel-left"></div>
                            <div class="tape-spool tape-spool-right"></div>
                            <div class="reel" id="reel-right"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PANTALLA DIGITAL (WAVEFORM LIBRE) -->
        <div class="digital-display">
            <div class="status-text mono">
                <span id="status-text" aria-live="polite">Analizando...</span>
                <span>GDL·MX</span>
            </div>

            <div class="waveform-wrapper" id="waveform-wrapper">
                <canvas id="canvas-base"></canvas>
                <canvas id="canvas-progress"></canvas>
            </div>
            
            <div class="time-display mono">
                <span id="time-elapsed">0:00</span>
                <span id="time-total">0:00</span>
            </div>
        </div>

        <!-- BOTONES MECÁNICOS CLÁSICOS -->
        <div class="mechanical-controls">
            <!-- BOTÓN STOP (ROJO) -->
            <button class="mech-btn stop-btn" onclick="stopAudio()" aria-label="Detener memoria">
                <div class="btn-led"></div>
                <div class="btn-content">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                    STOP
                </div>
            </button>
            
            <!-- BOTÓN PLAY/PAUSE (VERDE) -->
            <button class="mech-btn play-btn" id="custom-play-btn" onclick="togglePlay()" aria-label="Reproducir memoria">
                <div class="btn-led"></div>
                <div class="btn-content">
                    <svg class="btn-icon" id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="btn-icon" id="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    <span id="play-text-label">PLAY</span>
                </div>
            </button>
        </div>

        <audio id="native-audio"></audio>
    </div>

    <a href="https://etereomx.com" class="back-link">Descubre Etéreo Studio</a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const audioId = params.get('id');

        const statusText = document.getElementById('status-text');
        const waveformWrapper = document.getElementById('waveform-wrapper');
        const audioEl = document.getElementById('native-audio');
        
        // Elementos de los botones
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const playTextLabel = document.getElementById('play-text-label');
        const playBtn = document.getElementById('custom-play-btn');
        
        const reelLeft = document.getElementById('reel-left');
        const reelRight = document.getElementById('reel-right');
        const timeElapsed = document.getElementById('time-elapsed');
        const timeTotal = document.getElementById('time-total');

        const canvasBase = document.getElementById('canvas-base');
        const canvasProgress = document.getElementById('canvas-progress');
        const ctxBase = canvasBase.getContext('2d');
        const ctxProgress = canvasProgress.getContext('2d');

        let animationFrame;
        let peaks = [];
        let isDemo = !audioId; 
        let isPlaying = false;

        let demoProgress = 0;
        let lastTime = 0;
        const demoDuration = 10000; 

        const colorBase = "rgba(237, 230, 214, 0.18)";
        const colorProgress = "#DD8E5C";

        function setReelsSpinning(spinning) {
            reelLeft.classList.toggle('spinning', spinning);
            reelRight.classList.toggle('spinning', spinning);
        }

        function formatTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        const AUDIO_FORMATS = ['mp3', 'm4a', 'wav'];
        const MAX_ATTEMPTS = 3;
        const RETRY_DELAY_MS = 2500;

        function showShimmer() { waveformWrapper.classList.add('loading'); }
        function hideShimmer() { waveformWrapper.classList.remove('loading'); }

        async function findAudioSource(id) {
            for (const ext of AUDIO_FORMATS) {
                const path = `audios/${id}.${ext}`;
                try {
                    const response = await fetch(path);
                    if (response.ok) {
                        const arrayBuffer = await response.arrayBuffer();
                        return { path, arrayBuffer };
                    }
                } catch (e) { }
            }
            return null;
        }

        async function tryLoadAudio(id, attempt = 1) {
            statusText.innerHTML = attempt === 1
                ? "Buscando frecuencia..."
                : `Sincronizando<span class="accent">...</span> (${attempt})`;

            const found = await findAudioSource(id);

            if (found) {
                try {
                    audioEl.preload = 'auto';
                    audioEl.src = found.path;
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    const audioCtx = new AudioContextClass();
                    const audioBuffer = await audioCtx.decodeAudioData(found.arrayBuffer);
                    processAudioData(audioBuffer);
                    hideShimmer();
                    statusText.innerHTML = "<span class='accent'>Cinta lista.</span>";
                    attemptAutoplay();
                    return;
                } catch (e) { }
            }

            if (attempt < MAX_ATTEMPTS) {
                setTimeout(() => tryLoadAudio(id, attempt + 1), RETRY_DELAY_MS);
            } else {
                isDemo = true;
                hideShimmer();
                initDemoMode("Sincronizando...<br><span class='accent'>Prueba los controles.</span>");
            }
        }

        if (!isDemo) {
            showShimmer();
            tryLoadAudio(audioId);
        } else {
            initDemoMode("Modo Demostración.<br><span class='accent'>Presiona Play.</span>");
        }

        function attemptAutoplay() {
            const playPromise = audioEl.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    startPlaybackState();
                }).catch(() => {
                    statusText.innerHTML = "Lista.<br><span class='accent'>Presiona PLAY.</span>";
                });
            }
        }

        function initDemoMode(message) {
            statusText.innerHTML = message;
            peaks = [];
            for(let i = 0; i < 200; i++) {
                let wave = Math.abs(Math.sin(i * 0.1) * Math.cos(i * 0.05));
                let noise = Math.random() * 0.3;
                let bellCurve = Math.sin(Math.PI * (i / 200));
                peaks.push(((wave + noise) * bellCurve) * 0.8 + 0.05);
            }
            prepareCanvases();
        }

        function processAudioData(audioBuffer) {
            const rawData = audioBuffer.getChannelData(0);
            const numSamples = 200;
            const blockSize = Math.floor(rawData.length / numSamples);
            let maxPeak = 0;

            for (let i = 0; i < numSamples; i++) {
                let sum = 0;
                for (let j = 0; j < blockSize; j++) {
                    sum += Math.abs(rawData[i * blockSize + j]);
                }
                let peak = sum / blockSize;
                peaks.push(peak);
                if (peak > maxPeak) maxPeak = peak;
            }

            peaks = peaks.map(p => (p / maxPeak) * 0.8 + 0.05);
            prepareCanvases();
        }

        function prepareCanvases() {
            const dpr = window.devicePixelRatio || 1;
            const rect = waveformWrapper.getBoundingClientRect();

            [canvasBase, canvasProgress].forEach(c => {
                c.width = rect.width * dpr;
                c.height = rect.height * dpr;
                c.getContext('2d').scale(dpr, dpr);
            });

            drawPolygon(ctxBase, canvasBase.width / dpr, canvasBase.height / dpr, colorBase);
            updateProgress();
        }

        function drawPolygon(ctx, width, height, color) {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = color;
            ctx.beginPath();

            const centerY = height / 2;
            const step = width / (peaks.length - 1);

            ctx.moveTo(0, centerY);
            for (let i = 0; i < peaks.length; i++) {
                let amp = peaks[i] * height;
                ctx.lineTo(i * step, centerY - (amp / 2));
            }

            for (let i = peaks.length - 1; i >= 0; i--) {
                let amp = peaks[i] * height;
                ctx.lineTo(i * step, centerY + (amp / 2));
            }

            ctx.closePath();
            ctx.fill();
        }

        function updateProgress() {
            if (!peaks.length) return;

            const rect = canvasProgress.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;

            let currentP = 0;

            if (isDemo) {
                if (isPlaying) {
                    let now = Date.now();
                    let delta = now - lastTime;
                    lastTime = now;
                    demoProgress += delta / demoDuration;

                    if (demoProgress >= 1) {
                        demoProgress = 1;
                        stopAudio(); // Demo terminó, se detiene
                    }
                }
                currentP = demoProgress;
            } else {
                currentP = (audioEl.currentTime / (audioEl.duration || 1));
            }

            const fillWidth = width * currentP;

            ctxProgress.clearRect(0, 0, width, height);
            ctxProgress.save();
            ctxProgress.beginPath();
            ctxProgress.rect(0, 0, fillWidth, height);
            ctxProgress.clip();
            drawPolygon(ctxProgress, width, height, colorProgress);
            ctxProgress.restore();

            const totalSeconds = isDemo ? (demoDuration / 1000) : (audioEl.duration || 0);
            timeElapsed.textContent = formatTime(totalSeconds * currentP);
            timeTotal.textContent = formatTime(totalSeconds);

            if (isPlaying) {
                animationFrame = requestAnimationFrame(updateProgress);
            }
        }

        waveformWrapper.addEventListener('click', (e) => {
            if (!peaks.length) return;
            const rect = waveformWrapper.getBoundingClientRect();
            const ratio = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
            if (isDemo) {
                demoProgress = ratio;
            } else if (audioEl.duration) {
                audioEl.currentTime = ratio * audioEl.duration;
            }
            updateProgress();
        });

        // --- LÓGICA DE BOTONES MECÁNICOS ---

        function startPlaybackState() {
            isPlaying = true;
            iconPlay.style.display = "none";
            iconPause.style.display = "block";
            playTextLabel.textContent = "PAUSE";
            playBtn.classList.add('playing'); // Enciende el LED verde
            
            setReelsSpinning(true);
            lastTime = Date.now();
            statusText.innerHTML = "▶ <span class='accent'>Reproduciendo...</span>";
            updateProgress();
        }

        function pausePlaybackState() {
            isPlaying = false;
            iconPlay.style.display = "block";
            iconPause.style.display = "none";
            playTextLabel.textContent = "PLAY";
            playBtn.classList.remove('playing'); // Apaga el LED verde
            
            setReelsSpinning(false);
            statusText.innerHTML = "‖ <span class='accent'>Pausado.</span>";
            cancelAnimationFrame(animationFrame);
        }

        function togglePlay() {
            if (!isPlaying) {
                if (isDemo && demoProgress >= 1) demoProgress = 0;
                if (!isDemo) audioEl.play();
                startPlaybackState();
            } else {
                if (!isDemo) audioEl.pause();
                pausePlaybackState();
            }
        }

        // NUEVA FUNCIÓN: STOP (Detiene y reinicia a 0)
        function stopAudio() {
            isPlaying = false;
            
            // Actualizar botones a estado original
            iconPlay.style.display = "block";
            iconPause.style.display = "none";
            playTextLabel.textContent = "PLAY";
            playBtn.classList.remove('playing');
            setReelsSpinning(false);
            
            if (isDemo) {
                demoProgress = 0;
                statusText.innerHTML = "■ <span class='accent'>Cinta detenida.</span>";
            } else {
                audioEl.pause();
                audioEl.currentTime = 0; // Regresa la cinta al inicio
                statusText.innerHTML = "■ <span class='accent'>Cinta detenida.</span>";
            }
            
            cancelAnimationFrame(animationFrame);
            updateProgress(); // Fuerza el repintado a 0:00
        }

        audioEl.onended = stopAudio;
    </script>
</body>
</html>
