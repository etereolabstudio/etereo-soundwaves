<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etéreo | Memoria Acústica</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap');

        body {
            background-color: #F7F7F9;
            color: #2B2B2B;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .card {
            background: #FFFFFF;
            padding: 50px 30px 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.04);
            max-width: 320px;
            width: 90%;
            position: relative;
            overflow: hidden;
        }

        .brand-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 6px;
            margin: 0 0 15px 0;
            color: #1A1A1A;
            text-transform: uppercase;
        }

        .status-text {
            font-size: 13px;
            color: #8B8B8B;
            margin-bottom: 30px;
            line-height: 1.6;
            min-height: 40px;
        }

        .accent {
            color: #A39171;
            font-style: italic;
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
        }

        /* --- UI DEL REPRODUCTOR --- */
        .player-container {
            display: none; /* Se activa con JS si hay ID */
            flex-direction: column;
            align-items: center;
        }

        .play-btn {
            background-color: #A39171;
            border: none;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(163, 145, 113, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            z-index: 2;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(163, 145, 113, 0.4);
        }

        .play-btn:active { transform: scale(0.95); }

        .icon-play, .icon-pause {
            fill: #FFFFFF;
            width: 22px;
            height: 22px;
        }
        .icon-pause { display: none; }

        /* --- VISUALIZADOR DE ONDAS ANIMADO --- */
        .wave-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            margin-top: 25px;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .wave-bar {
            width: 3px;
            height: 4px;
            background-color: #A39171;
            border-radius: 4px;
            transition: height 0.2s ease;
        }

        .playing .wave-bar { animation: wave-bounce 1s infinite ease-in-out; }
        .playing .wave-bar:nth-child(1) { animation-delay: 0.0s; }
        .playing .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .playing .wave-bar:nth-child(3) { animation-delay: 0.4s; }
        .playing .wave-bar:nth-child(4) { animation-delay: 0.1s; }
        .playing .wave-bar:nth-child(5) { animation-delay: 0.5s; }
        .playing .wave-bar:nth-child(6) { animation-delay: 0.3s; }
        .playing .wave-bar:nth-child(7) { animation-delay: 0.1s; }

        @keyframes wave-bounce {
            0%, 100% { height: 8px; }
            50% { height: 35px; }
        }

        /* --- BARRA DE PROGRESO --- */
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: #F0F0F0;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #A39171;
            transition: width 0.1s linear;
        }

        /* Reproductor nativo oculto */
        audio { display: none; }

    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h1 class="brand-title">Etéreo</h1>
        <p class="status-text" id="status-text">Analizando firma acústica...</p>
        
        <div class="player-container" id="player-ui">
            <button class="play-btn" id="custom-play-btn" onclick="togglePlay()">
                <svg class="icon-play" id="icon-play" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg class="icon-pause" id="icon-pause" viewBox="0 0 24 24">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>

            <!-- Visualizador Animado -->
            <div class="wave-container" id="wave-visualizer">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>
        </div>

        <!-- Barra de progreso anclada al fondo de la tarjeta -->
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <audio id="native-audio"></audio>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const audioId = params.get('id');
        
        const statusText = document.getElementById('status-text');
        const playerUI = document.getElementById('player-ui');
        const audioEl = document.getElementById('native-audio');
        const playBtn = document.getElementById('custom-play-btn');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const waveVisualizer = document.getElementById('wave-visualizer');
        const progressBar = document.getElementById('progress-bar');

        if (audioId) {
            const audioPath = `audios/${audioId}.wav`;
            
            fetch(audioPath, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        audioEl.src = audioPath;
                        playerUI.style.display = "flex";
                        statusText.innerHTML = "Memoria acústica recuperada.<br><span class='accent'>Presiona reproducir.</span>";
                    } else {
                        statusText.innerHTML = "La cápsula está vacía.<br>Verifica el enlace o la sincronización con el estudio.";
                    }
                })
                .catch(() => {
                    statusText.innerHTML = "Error de red.<br>Verifica tu conexión a internet.";
                });
        } else {
            // EL ESTADO VACÍO (Landing Promocional)
            statusText.innerHTML = "Bienvenido a Etéreo.<br><br>Acerca tu dispositivo al chip NFC de tu cuadro para reproducir tu memoria acústica.<br><br><span class='accent'>etereomx.com</span>";
        }

        function togglePlay() {
            if (audioEl.paused) {
                audioEl.play();
                iconPlay.style.display = "none";
                iconPause.style.display = "block";
                waveVisualizer.classList.add("playing");
                waveVisualizer.style.opacity = "1";
                statusText.innerHTML = "<span class='accent'>Reproduciendo...</span>";
            } else {
                audioEl.pause();
                iconPlay.style.display = "block";
                iconPause.style.display = "none";
                waveVisualizer.classList.remove("playing");
                waveVisualizer.style.opacity = "0.3";
                statusText.innerHTML = "Pausado.<br><span class='accent'>Presiona reproducir.</span>";
            }
        }

        // Animación de la barra de progreso
        audioEl.addEventListener('timeupdate', () => {
            if (audioEl.duration) {
                const progress = (audioEl.currentTime / audioEl.duration) * 100;
                progressBar.style.width = progress + "%";
            }
        });

        // Resetear interfaz al terminar
        audioEl.onended = function() {
            iconPlay.style.display = "block";
            iconPause.style.display = "none";
            waveVisualizer.classList.remove("playing");
            waveVisualizer.style.opacity = "0";
            progressBar.style.width = "0%";
            statusText.innerHTML = "Memoria finalizada.<br><span class='accent'>Vuelve a reproducir.</span>";
        };
    </script>

</body>
</html>
