<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etéreo Lab Studio | Memoria Activa</title>
    <style>
        /* Paleta Corporativa Etéreo Lab Studio */
        :root {
            /* Fondo con un gradiente radial sutil para dar profundidad */
            --bg-gradient: radial-gradient(circle at center, #011c40 0%, #000814 100%);
            --text-color: #f8f9fa;
            --accent-color: #e6dfd1;
            --accent-glow: rgba(230, 223, 209, 0.3);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .player-container {
            text-align: center;
            padding: 45px 25px;
            /* Efecto cristal (Glassmorphism) sutil en el contenedor */
            border: 1px solid rgba(230, 223, 209, 0.1);
            border-radius: 24px;
            background: rgba(1, 21, 51, 0.6);
            backdrop-filter: blur(10px); /* Desenfoque del fondo detrás del contenedor */
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            width: 85%;
            max-width: 380px;
            position: relative;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
            letter-spacing: 4px;
            font-weight: 300;
        }

        .accent {
            font-weight: 700;
            color: var(--accent-color);
        }

        p.subtitle {
            font-size: 11px;
            color: #8b9bb4;
            margin-top: 0;
            margin-bottom: 35px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Lienzo del Osciloscopio */
        canvas {
            width: 100%;
            height: 150px;
            margin-bottom: 35px;
            /* Eliminamos el borde y fondo del canvas para que las barras floten */
        }

        /* NUEVO DISEÑO DE BOTÓN PREMIUM */
        .play-btn-container {
            position: relative;
            width: 85px;
            height: 85px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .play-btn {
            background-color: rgba(230, 223, 209, 0.1); /* Fondo semi-transparente */
            color: var(--accent-color);
            border: 3px solid var(--accent-color); /* Borde más grueso */
            border-radius: 50%;
            width: 100%;
            height: 100%;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0; /* Reset de padding */
            box-shadow: 0 0 25px var(--accent-glow); /* Resplandor sutil constante */
        }
        
        /* Iconos SVG dentro del botón */
        .play-btn svg {
            width: 32px;
            height: 32px;
            fill: var(--accent-color);
            transition: transform 0.3s ease;
        }
        
        /* Ajuste óptico para centrar el icono de Play (triángulo) */
        .play-icon { margin-left: 5px; }

        .play-btn:hover {
            background-color: var(--accent-color);
            transform: scale(1.1);
            box-shadow: 0 0 40px var(--accent-glow), 0 0 10px var(--accent-color); /* Doble resplandor al pasar el mouse */
        }
        
        .play-btn:hover svg {
            fill: var(--bg-color); /* Cambia el icono a oscuro al hacer hover */
            transform: scale(1.1);
        }
        
        .play-btn:active {
            transform: scale(0.95); /* Efecto de clic */
        }

        #status-text {
            margin-top: 30px;
            font-size: 13px;
            font-weight: 300;
            font-style: italic;
            height: 20px;
            color: #a0aec0;
            letter-spacing: 0.5px;
        }
        
        /* Ocultar iconos por defecto */
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="player-container">
        <h1>ETÉREO <span class="accent">LAB</span></h1>
        <p class="subtitle">Conexión de Memoria</p>

        <canvas id="visualizer"></canvas>

        <audio id="audio-player" crossorigin="anonymous"></audio>
        
        <div class="play-btn-container">
            <button class="play-btn" id="play-btn" onclick="togglePlay()">
                <svg id="play-icon" class="play-icon" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg id="pause-icon" class="hidden" viewBox="0 0 24 24">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>
        </div>

        <p id="status-text">Sincronizando frecuencia...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const audioId = urlParams.get('id');
        
        const audioPlayer = document.getElementById('audio-player');
        const statusText = document.getElementById('status-text');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');

        // Ajuste HD para pantallas retina
        canvas.width = canvas.offsetWidth * 2;
        canvas.height = canvas.offsetHeight * 2;
        ctx.scale(2, 2);

        let audioContext = null;
        let analyser = null;
        let source = null;
        let animationId = null;
        let isInitialized = false;

        // Dibuja una línea sutil de "espera"
        function drawFlatline() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.moveTo(0, canvas.offsetHeight / 2);
            ctx.lineTo(canvas.offsetWidth, canvas.offsetHeight / 2);
            ctx.strokeStyle = '#e6dfd1';
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.2;
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }
        drawFlatline();

        if (audioId) {
            const cacheBuster = new Date().getTime();
            audioPlayer.src = `./audios/${audioId}.wav?cb=${cacheBuster}`;
            audioPlayer.load();
            audioPlayer.oncanplay = function() {
                statusText.innerText = "Cápsula lista. Toque para conectar.";
            };
        } else {
            statusText.innerText = "Error: Cápsula no detectada.";
            document.getElementById('play-btn').style.display = 'none';
        }

        function initAudioEngine() {
            if (isInitialized) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioContext();
            analyser = audioContext.createAnalyser();
            // FFT Size 128 = 64 barras de frecuencia. Ideal para móviles.
            analyser.fftSize = 128; 
            source = audioContext.createMediaElementSource(audioPlayer);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            isInitialized = true;
        }

        // --- CORRECCIÓN MATEMÁTICA DE CENTRADO ---
        function drawVisualizer() {
            if (!analyser || audioPlayer.paused) return;
            animationId = requestAnimationFrame(drawVisualizer);
            
            const bufferLength = analyser.frequencyBinCount; // Será 64
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Configuración de barras
            const barSpacing = 2; // Espacio entre barras
            // Calculamos el ancho exacto para llenar el canvas sin sobrar espacio
            const barWidth = (canvas.offsetWidth / bufferLength) - barSpacing;
            
            let barHeight;
            let x = barSpacing / 2; // Offset inicial para centrado perfecto
            const centerY = canvas.offsetHeight / 2;
            
            for(let i = 0; i < bufferLength; i++) {
                // Aumentamos un poco la sensibilidad (*0.8) para que se mueva más
                barHeight = (dataArray[i] / 255) * (canvas.offsetHeight / 2) * 0.8;
                
                // Color de la paleta Oro Laminado
                ctx.fillStyle = '#e6dfd1';
                
                // Dibujo simétrico (Espejo)
                // Hacia arriba
                ctx.fillRect(x, centerY - barHeight, barWidth, barHeight);
                // Hacia abajo
                ctx.fillRect(x, centerY + 1, barWidth, barHeight); // +1 para evitar una línea gap en el centro
                
                x += barWidth + barSpacing;
            }
        }

        function togglePlay() {
            if (!audioId) return;

            if (!isInitialized) initAudioEngine();
            if (audioContext && audioContext.state === 'suspended') audioContext.resume();

            if (audioPlayer.paused) {
                audioPlayer.play().then(() => {
                    // Cambiar iconos SVG
                    playIcon.classList.add('hidden');
                    pauseIcon.classList.remove('hidden');
                    statusText.innerText = "Reproduciendo memoria...";
                    drawVisualizer();
                }).catch(e => { console.error("Error DSP:", e); });
            } else {
                audioPlayer.pause();
                // Cambiar iconos SVG
                pauseIcon.classList.add('hidden');
                playIcon.classList.remove('hidden');
                statusText.innerText = "En pausa.";
                cancelAnimationFrame(animationId);
                drawFlatline();
            }
        }

        audioPlayer.onended = function() {
            pauseIcon.classList.add('hidden');
            playIcon.classList.remove('hidden');
            statusText.innerText = "Memoria finalizada.";
            cancelAnimationFrame(animationId);
            drawFlatline();
        };

        audioPlayer.onerror = function() {
            statusText.innerText = "Error 404: Archivo no encontrado.";
            console.error("Error de carga: " + audioPlayer.src);
        };
    </script>
</body>
</html>
