<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etéreo Lab Studio | Soundwave</title>
    <style>
        :root {
            --bg-color: #011129;
            --text-color: #f8f9fa;
            --accent-color: #e6dfd1;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .player-container {
            text-align: center;
            padding: 40px 20px;
            border: 1px solid rgba(230, 223, 209, 0.2);
            border-radius: 15px;
            background: linear-gradient(145deg, #011533, #010d20);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 85%;
            max-width: 350px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .accent {
            color: var(--accent-color);
        }

        p.subtitle {
            font-size: 13px;
            color: #8b9bb4;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .play-btn {
            background-color: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }

        .play-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            transform: scale(1.05);
        }

        #status-text {
            margin-top: 25px;
            font-size: 14px;
            font-style: italic;
            height: 20px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h1>ETÉREO <span class="accent">LAB</span></h1>
        <p class="subtitle">Cápsula de Memoria Auditiva</p>

        <audio id="audio-player"></audio>
        <button class="play-btn" id="play-btn" onclick="togglePlay()">▶</button>
        <p id="status-text">Buscando frecuencia...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const audioId = urlParams.get('id');
        
        const audioPlayer = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const statusText = document.getElementById('status-text');

        if (audioId) {
            // Se fuerza el formato .wav y se añade un cache-buster dinámico
            const cacheBuster = new Date().getTime();
            audioPlayer.src = `audios/${audioId}.wav?cb=${cacheBuster}`;
            
            // Pre-cargar metadatos para asegurar que existe
            audioPlayer.load();
            
            audioPlayer.oncanplay = function() {
                statusText.innerText = "Frecuencia sincronizada. Lista.";
            };
        } else {
            statusText.innerText = "Cápsula no detectada.";
            playBtn.style.display = 'none';
        }

        function togglePlay() {
            if (!audioId) return;

            if (audioPlayer.paused) {
                audioPlayer.play().then(() => {
                    playBtn.innerHTML = "⏸";
                    statusText.innerText = "Reproduciendo memoria...";
                }).catch(e => {
                    console.error("Error al reproducir:", e);
                    statusText.innerText = "Espera a que cargue la señal...";
                });
            } else {
                audioPlayer.pause();
                playBtn.innerHTML = "▶";
                statusText.innerText = "Pausado";
            }
        }

        audioPlayer.onended = function() {
            playBtn.innerHTML = "▶";
            statusText.innerText = "Memoria finalizada.";
        };

        audioPlayer.onerror = function() {
            statusText.innerText = "Error 404: Frecuencia no encontrada.";
            playBtn.style.display = 'none';
            console.error("No se pudo cargar: " + audioPlayer.src);
        };
    </script>
</body>
</html>
